# Dependency update pull requests (security updates are raised as soon as an
# advisory appears; version updates weekly). Minor and patch updates are grouped
# per ecosystem to keep the number of pull requests small.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend:
        update-types: [minor, patch]
    commit-message:
      prefix: chore

  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docs:
        update-types: [minor, patch]
    commit-message:
      prefix: chore

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        update-types: [minor, patch]
    commit-message:
      prefix: chore

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore
