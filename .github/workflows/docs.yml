name: Docs

# Builds the documentation site and publishes it to GitHub Pages. Publishing needs Pages
# enabled for the repository with "GitHub Actions" as the source (Settings > Pages) and
# the repository variable PAGES_ENABLED=true; until then only the build runs, so pushes
# do not fail ("Before the Public Release" in docs/PROGRESS.md).
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Build site
        run: mkdocs build --strict

      - uses: actions/configure-pages@v6
        if: vars.PAGES_ENABLED == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: vars.PAGES_ENABLED == 'true'
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
