# OCMP Docker Compose Configuration
# See .env.example for configuration options

name: ocmp

services:
  # PostgreSQL database with pgvector extension
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ocmp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ocmp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ocmp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for sessions, caching, and job queue
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot database migration (runs before api and worker start)
  migrate:
    image: ocmp-backend:local
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: alembic upgrade head
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
    depends_on:
      db:
        condition: service_healthy

  # FastAPI backend
  api:
    image: ocmp-backend:local
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # The api is only reachable through Caddy, so trust its X-Forwarded-* headers
      # (needed for real client IPs in login rate limiting).
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Dramatiq worker for background jobs
  worker:
    image: ocmp-backend:local
    command: dramatiq app.worker --processes 1 --threads 4
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # React frontend (served by Caddy in production)
  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: ocmp-web:local
    restart: unless-stopped
    depends_on:
      - api

  # Caddy reverse proxy with auto-HTTPS
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      DOMAIN: ${DOMAIN:-localhost}

  # Optional: Local embedding model
  embeddings:
    image: ghcr.io/ocmp/embeddings:latest
    profiles: ["embeddings"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Ollama for local LLM
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  ollama_data:
