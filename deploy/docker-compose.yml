# Curriculum in Context Docker Compose Configuration
# See .env.example for configuration options. By default the Curriculum in Context images are built
# from this checkout (`up --build`); set OCMP_BACKEND_IMAGE and OCMP_WEB_IMAGE in
# .env to run released images from GitHub Container Registry instead.

name: ocmp

# Container logs (Caddy's include client IP addresses) are rotated: at most
# 5 files of 10 MB per service. See docs/privacy/data-inventory.md.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # PostgreSQL database with pgvector extension
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ocmp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ocmp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ocmp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for sessions, caching, and job queue
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *logging
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot database migration (runs before api and worker start)
  migrate:
    image: ${OCMP_BACKEND_IMAGE:-ocmp-backend:local}
    # All Curriculum in Context settings from .env; the entries under `environment` take precedence.
    env_file: .env
    build:
      context: ../backend
      dockerfile: Dockerfile
    # Apply migrations, then create/update the built-in roles.
    command: sh -c "alembic upgrade head && python -m app.cli sync-roles"
    restart: "no"
    logging: *logging
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
    depends_on:
      db:
        condition: service_healthy

  # FastAPI backend
  api:
    image: ${OCMP_BACKEND_IMAGE:-ocmp-backend:local}
    # All Curriculum in Context settings from .env; the entries under `environment` take precedence.
    env_file: .env
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PUBLIC_URL: ${PUBLIC_URL:-https://${DOMAIN:-localhost}}
      # Proxies allowed to report the client address (X-Forwarded-For); hostnames
      # resolve via compose DNS. Used for per-address sign-in limits.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-caddy}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Dramatiq worker for background jobs
  worker:
    image: ${OCMP_BACKEND_IMAGE:-ocmp-backend:local}
    # All Curriculum in Context settings from .env; the entries under `environment` take precedence.
    env_file: .env
    command: dramatiq app.worker --processes 1 --threads 4
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # The worker builds links in emails (e.g. password reset).
      PUBLIC_URL: ${PUBLIC_URL:-https://${DOMAIN:-localhost}}
    # The worker serves no HTTP, so the image's curl check does not apply. Healthy means
    # the Dramatiq process runs and its Redis broker answers. Newer Docker Compose
    # versions fail `up --wait` for running services without a healthcheck.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, redis; assert b'dramatiq' in open('/proc/1/cmdline', 'rb').read(); redis.Redis.from_url(os.environ['REDIS_URL'], socket_timeout=5).ping()"
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # React frontend (served by Caddy in production)
  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: ${OCMP_WEB_IMAGE:-ocmp-web:local}
    restart: unless-stopped
    logging: *logging
    depends_on:
      - api

  # Caddy reverse proxy with auto-HTTPS
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Local site additions (e.g. your own certificate); see caddy/README.md.
      - ./caddy:/etc/caddy/site.d:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      DOMAIN: ${DOMAIN:-localhost}

  # Optional, development only: catches all outgoing email.
  # Web UI at http://localhost:8025. Set SMTP_HOST=mailpit, SMTP_PORT=1025, SMTP_TLS=false.
  mailpit:
    image: axllent/mailpit:v1.31
    profiles: ["mailpit"]
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:8025:8025"

  # Optional, off by default: local embedding model (ADR 007). Not available yet:
  # nothing uses embeddings before Phase 1, and the image is published from the
  # Phase 1 embeddings slice. Starting this profile before then fails to pull.
  embeddings:
    image: ${OCMP_EMBEDDINGS_IMAGE:-ghcr.io/openaudire/ocmp-embeddings:latest}
    profiles: ["embeddings"]
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Ollama for local LLM
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    logging: *logging
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  ollama_data:
